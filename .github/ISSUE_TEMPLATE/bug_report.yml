name: Bug report
description: Report reproducible behavior in Daaneshyar
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Upload...
        2. Ask...
        3. See...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.12, Docker Desktop...
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and document content before pasting logs.
      render: shell
