[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "daaneshyar-rag"
version = "1.0.0"
description = "Persian-first document RAG API with hybrid retrieval and citations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Aboozar Shabnani" }
]
dependencies = [
  "fastapi>=0.115.6,<1.0",
  "uvicorn[standard]>=0.34.0,<1.0",
  "pydantic-settings>=2.7.1,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "httpx>=0.28.1,<1.0",
  "qdrant-client>=1.13.2,<2.0",
  "pypdf>=5.1.0,<7.0",
  "python-docx>=1.1.2,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9.0",
  "pytest-cov>=6.0.0,<8.0",
  "ruff>=0.8.4,<1.0"
]
local-embeddings = [
  "sentence-transformers>=3.3.1,<6.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
