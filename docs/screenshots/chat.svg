      .soft { fill: #adbbce; }
      .white { fill: #edf3fb; }
      .gold { fill: #efb45d; }
      .teal { fill: #5fd5bd; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
