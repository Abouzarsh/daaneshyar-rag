  <rect x="1023" y="238" width="36" height="36" rx="10" fill="#5fd5bd" fill-opacity=".09" stroke="#5fd5bd" stroke-opacity=".35"/>
  <path d="M1041 247l2.5 5.5 5.5 2.5-5.5 2.5-2.5 5.5-2.5-5.5-5.5-2.5 5.5-2.5Z" fill="#5fd5bd"/>
