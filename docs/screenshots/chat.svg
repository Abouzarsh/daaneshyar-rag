  <text x="1014" y="449" text-anchor="middle" class="gold" font-size="10" font-weight="700">1</text>
  <text x="984" y="443" text-anchor="end" class="white" font-size="10.5">network-operations-handbook-fa.md</text>
  <text x="984" y="465" text-anchor="end" class="muted rtl" font-size="9">بازیابی معنایی + کلیدواژه‌ای</text>
