  <rect x="522" y="126" width="522" height="72" rx="16" fill="#efb45d" fill-opacity=".08" stroke="#efb45d" stroke-opacity=".25"/>
  <text x="1018" y="155" text-anchor="end" class="white rtl" font-size="13">در رخداد P1 زمان پذیرش و هدف بازگردانی اولیه</text>
  <text x="1018" y="178" text-anchor="end" class="white rtl" font-size="13">سرویس چقدر است؟</text>

