  <rect x="284" y="509" width="760" height="108" rx="12" fill="#ffffff" fill-opacity=".025" stroke="#adc4e2" stroke-opacity=".1"/>
  <text x="1018" y="541" text-anchor="end" class="soft rtl" font-size="10.5">رخداد بحرانی یا P1 رویدادی است که باعث قطع کامل یک سرویس اصلی شود.</text>
  <text x="1018" y="568" text-anchor="end" class="soft rtl" font-size="10.5">زمان پذیرش رخداد P1 حداکثر ۵ دقیقه و هدف بازگردانی اولیه سرویس</text>
  <text x="1018" y="595" text-anchor="end" class="soft rtl" font-size="10.5">۳۰ دقیقه است.</text>

